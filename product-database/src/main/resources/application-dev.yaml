logging:
  level:
    com.zaxxer.hikari: debug

spring:
  datasource:
    url: jdbc:mysql://database-mall.cluster-ro-cxeimrypxlu8.ap-northeast-1.rds.amazonaws.com:3306/mall?useSSL=false&allowPublicKeyRetrieval=true&?enabledTLSProtocols=TLSv1.2
    username: ${MALL_DATABASE_USERNAME:admin}
    password: ${MALL_DATABASE_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      max-lifetime: 1800000
      idle-timeout: 600000
      connection-timeout: 30000
      connection-test-query: select 1 from dual
